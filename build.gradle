plugins {
    id 'java-library'
    id 'fabric-loom' version "${fabric_loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Local development contracts only. The released mod declares both as
    // runtime dependencies and never embeds either jar.
    modCompileOnly files('../../Region Engine/repo/build/libs/region_engine-0.7.0.jar')
    def cobblemonDevJar = providers.gradleProperty('cobblemon_dev_jar').orNull
    if (cobblemonDevJar == null) {
        throw new GradleException('Set -Pcobblemon_dev_jar=<path to Cobblemon Fabric jar> for local development.')
    }
    modCompileOnly files(cobblemonDevJar)
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'

    // Plain JUnit for pure-logic shape tests (road graph, gym allocation).
    // These never boot a server or a Minecraft client; they exercise
    // deterministic algorithms directly. See src/test/java.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.properties([
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_license: mod_license,
            mod_authors: mod_authors,
            fabric_loader_version: fabric_loader_version,
            minecraft_version: minecraft_version
    ])

    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
